<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>M-Team 排行榜悬浮大图 · 演示页</title>
<style>
  :root {
    --bg: #14161a;
    --panel: #1b1e24;
    --line: #2a2f38;
    --text: #e6e8eb;
    --muted: #8b93a1;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  /* 顶栏 + 排序条：只为了还原页面观感，脚本不依赖这些结构 */
  header {
    display: flex; align-items: center; gap: 24px;
    padding: 0 28px; height: 56px;
    background: #101216; border-bottom: 1px solid var(--line);
  }
  header .logo { font-weight: 700; letter-spacing: .5px; }
  header nav { display: flex; gap: 18px; color: var(--muted); font-size: 13px; }
  header nav .active { color: #fff; }
  .toolbar {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 28px; max-width: 1180px; margin: 0 auto;
  }
  .toolbar .hint { margin-left: auto; color: var(--muted); font-size: 12px; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg span { padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .seg span.on { background: #262b33; color: #fff; }

  /* antd Table 近似样式 */
  table.ant-table {
    width: 100%; max-width: 1180px; margin: 0 auto 40px;
    border-collapse: collapse; table-layout: fixed;
    background: var(--panel); border-radius: 10px; overflow: hidden;
  }
  table.ant-table thead th {
    text-align: left; font-weight: 500; color: var(--muted);
    background: #21252c; padding: 10px 12px; font-size: 13px;
    border-bottom: 1px solid var(--line);
  }
  table.ant-table tbody td {
    padding: 8px 12px; border-bottom: 1px solid var(--line);
    vertical-align: middle; color: #d5d9df;
  }
  table.ant-table tbody tr:hover { background: #232830; }
  table.ant-table tbody tr.ant-table-row { cursor: pointer; }
  td.rank { color: var(--muted); font-variant-numeric: tabular-nums; }
  td.center { text-align: center; }
  .title-cell a { color: #9ec5ff; text-decoration: none; }
  .title-cell a:hover { text-decoration: underline; }
  .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
</style>
</head>
<body>
<header>
  <div class="logo">M-Team</div>
  <nav>
    <span>首页</span><span>种子</span><span class="active">排行榜（新）</span><span>发布</span>
  </nav>
</header>

<div class="toolbar">
  <div class="seg"><span class="on">最多完成</span><span>最多做种</span><span>最多下载</span></div>
  <div class="hint">把鼠标移到任意一行上 → 右侧弹出大图（Alt+P 开关）</div>
</div>

<table class="ant-table ant-table-small table-fixed">
  <colgroup>
    <col style="width:64px" /><col /><col style="width:90px" /><col style="width:150px" />
    <col style="width:100px" /><col style="width:100px" /><col style="width:100px" />
  </colgroup>
  <thead>
    <tr>
      <th>排名</th><th>标题</th><th class="center">大小</th><th>创建时间</th>
      <th>抢完次</th><th>做种</th><th>下载</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script src="/script.user.js"></script>
<script>
  // 演示页专用：
  // 1) 像真的排行榜一样，先用 XHR 拉一份「接口数据」（/api/torrent/search 是 serve.mjs 里的假数据），
  //    行里只有标题文字、没有缩略图 —— 海报地址只存在于这份 JSON 的 imageList 里；
  // 2) ?autohover=3 时自动悬浮第 3 行，方便截图/回归。
  (function () {
    var tbody = document.querySelector('table.ant-table tbody');

    function cell(text, cls) {
      var td = document.createElement('td');
      if (cls) td.className = cls;
      td.textContent = text;
      return td;
    }

    function render(list) {
      tbody.innerHTML = '';
      list.forEach(function (t, i) {
        var tr = document.createElement('tr');
        tr.className = 'ant-table-row';
        tr.setAttribute('data-row-key', String(t.id));

        var tdTitle = document.createElement('td');
        var wrap = document.createElement('div');
        wrap.className = 'title-cell';
        var a = document.createElement('a');
        a.href = '/detail/' + t.id;
        a.textContent = t.name;
        var meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = t.categoryName || '电影';
        wrap.appendChild(a);
        wrap.appendChild(meta);
        tdTitle.appendChild(wrap);

        tr.appendChild(cell(String(i + 1), 'rank'));
        tr.appendChild(tdTitle);
        tr.appendChild(cell(t.size, 'center'));
        tr.appendChild(cell(t.createdDate));
        tr.appendChild(cell(String(t.timesCompleted), 'center'));
        tr.appendChild(cell(String(t.seeders), 'center'));
        tr.appendChild(cell(String(t.leechers), 'center'));
        tbody.appendChild(tr);
      });
    }

    var xhr = new XMLHttpRequest();
    xhr.open('GET', '/api/torrent/search?mode=rankings&pageSize=100');
    xhr.onload = function () {
      try {
        render(JSON.parse(xhr.responseText).data || []);
      } catch (e) {
        tbody.innerHTML = '<tr><td colspan="7">演示数据加载失败</td></tr>';
      }
      autoHover();
    };
    xhr.onerror = function () {
      tbody.innerHTML = '<tr><td colspan="7">演示数据加载失败</td></tr>';
    };
    xhr.send();

    function autoHover() {
      var n = parseInt((location.search.match(/autohover=(\d+)/) || [])[1], 10);
      if (!n) return;
      setTimeout(function () {
        var row = document.querySelectorAll('tr.ant-table-row')[n - 1];
        if (!row) return;
        var target = row.querySelector('a') || row;
        target.dispatchEvent(new PointerEvent('pointerover', {
          bubbles: true, composed: true, pointerType: 'mouse', pointerId: 1,
        }));
      }, 350);
    }
  })();
</script>
</body>
</html>
